<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">rime-config 接入流程</title>
  <desc id="desc">安装 oh-my-rime，复制小浪双拼 schema，合并 schema_list，重新部署 Rime。</desc>
  <defs>
    <style>
      .eyebrow { font-family: Arial, "PingFang SC", sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #66745c; }
      .title { font-family: Arial, "PingFang SC", sans-serif; font-size: 30px; font-weight: 700; fill: #253018; }
      .num { font-family: Menlo, "SFMono-Regular", monospace; font-size: 20px; font-weight: 700; fill: #f7f8f4; }
      .step { font-family: Arial, "PingFang SC", sans-serif; font-size: 21px; font-weight: 700; fill: #253018; }
      .detail { font-family: Menlo, "SFMono-Regular", monospace; font-size: 17px; font-weight: 400; fill: #56634a; }
      .arrow { stroke: #93a47b; stroke-width: 2; fill: none; }
      .dot { fill: #93a47b; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="#eef4e7"/>
  <text class="eyebrow" x="58" y="48">FIRST SUCCESSFUL ACTION</text>
  <text class="title" x="58" y="86">四步接入，不改动你的整套 Rime 配置</text>

  <path class="arrow" d="M274 165H314"/>
  <path class="arrow" d="M574 165H614"/>
  <path class="arrow" d="M874 165H914"/>
  <path class="arrow" d="M306 159l8 6-8 6"/>
  <path class="arrow" d="M606 159l8 6-8 6"/>
  <path class="arrow" d="M906 159l8 6-8 6"/>

  <g transform="translate(58 124)">
    <circle class="dot" cx="20" cy="40" r="20"/>
    <text class="num" x="12" y="47">1</text>
    <text class="step" x="56" y="34">准备上游</text>
    <text class="detail" x="56" y="64">oh-my-rime</text>
  </g>
  <g transform="translate(358 124)">
    <circle class="dot" cx="20" cy="40" r="20"/>
    <text class="num" x="12" y="47">2</text>
    <text class="step" x="56" y="34">复制 schema</text>
    <text class="detail" x="56" y="64">double_pinyin_xiaolang</text>
  </g>
  <g transform="translate(658 124)">
    <circle class="dot" cx="20" cy="40" r="20"/>
    <text class="num" x="12" y="47">3</text>
    <text class="step" x="56" y="34">合并入口</text>
    <text class="detail" x="56" y="64">default.custom.yaml</text>
  </g>
  <g transform="translate(958 124)">
    <circle class="dot" cx="20" cy="40" r="20"/>
    <text class="num" x="12" y="47">4</text>
    <text class="step" x="56" y="34">重新部署</text>
    <text class="detail" x="56" y="64">开始输入</text>
  </g>

  <text class="detail" x="58" y="266">这是增量 schema：词库、Lua、反查等能力仍由你现有的薄荷 / 雾凇生态提供。</text>
</svg>
